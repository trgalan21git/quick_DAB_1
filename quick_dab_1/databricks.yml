# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "quick_dab_1"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1083625187459851.11.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-1083625187459851.11.azuredatabricks.net
      # We always use /Users/trgalan@trgalansbcglobal.onmicrosoft.com for all resources to make sure we only have a single copy.
      root_path: /Users/trgalan@trgalansbcglobal.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as trgalan@trgalansbcglobal.onmicrosoft.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: trgalan@trgalansbcglobal.onmicrosoft.com
